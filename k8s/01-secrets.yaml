# ---------------------------------------------------------------------------
# DEV CREDENTIALS ONLY.
#
# These are the same hardcoded values as docker-compose.yml, kept here so a
# local cluster comes up with no extra setup. They are NOT safe for any shared
# or production cluster: this file is committed to git in plain text.
#
# For anything beyond local dev, delete this file and supply the secret out of
# band, e.g.:
#   kubectl -n orderoo create secret generic orderoo-secrets \
#     --from-literal=MSSQL_SA_PASSWORD='...' \
#     --from-literal=RABBITMQ_DEFAULT_USER='...' \
#     --from-literal=RABBITMQ_DEFAULT_PASS='...' \
#     --from-literal=ConnectionStrings__SqlServerConnection='...'
# or via Sealed Secrets / External Secrets / SOPS.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: orderoo-secrets
  namespace: orderoo
  labels:
    app.kubernetes.io/part-of: orderoo
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: "YourStrong@Password123"

  RABBITMQ_DEFAULT_USER: "admin"
  RABBITMQ_DEFAULT_PASS: "admin123"

  # Consumed by OrderApi as RabbitMq__Username / RabbitMq__Password
  RabbitMq__Username: "admin"
  RabbitMq__Password: "admin123"

  # Full connection string lives in the Secret because it embeds the SA password.
  # Host "sqlserver" is the ClusterIP Service name in 10-sqlserver.yaml.
  ConnectionStrings__SqlServerConnection: "Server=sqlserver,1433;Database=OrderDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;"
