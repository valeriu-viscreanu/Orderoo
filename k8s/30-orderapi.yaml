apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderapi
  namespace: orderoo
  labels:
    app.kubernetes.io/name: orderapi
    app.kubernetes.io/part-of: orderoo
spec:
  # Deliberately 1, not 2+.
  #
  # Program.cs runs dbContext.Database.Migrate() on startup, before app.Run().
  # EF Core migrations are not safe to run concurrently -- two pods starting at
  # once can deadlock or double-apply. To scale beyond 1 replica, move the
  # migration into a separate Job / initContainer that runs once, then remove
  # the Migrate() call from Program.cs.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: orderapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orderapi
        app.kubernetes.io/part-of: orderoo
    spec:
      # Kubernetes has no equivalent of compose's `depends_on: service_healthy`,
      # so these initContainers block startup until the backing services accept
      # connections. Without them the pod crash-loops until SQL Server is up.
      initContainers:
        - name: wait-for-sqlserver
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "waiting for sqlserver:1433..."
              until nc -z sqlserver 1433; do sleep 2; done
              echo "sqlserver is accepting connections"
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "waiting for rabbitmq:5672..."
              until nc -z rabbitmq 5672; do sleep 2; done
              echo "rabbitmq is accepting connections"
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
      containers:
        - name: orderapi
          # Locally built image -- there is no registry push step.
          # IfNotPresent is required so the kubelet does not try to pull it
          # from Docker Hub and fail with ImagePullBackOff.
          image: orderoo/orderapi:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: orderoo-config
            - secretRef:
                name: orderoo-secrets
                # Note: this also injects MSSQL_SA_PASSWORD / RABBITMQ_DEFAULT_*
                # into the pod. They are unused by the app but harmless; split
                # the Secret in two if you want tighter scoping.
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          # TCP probes, not HTTP.
          #
          # Program.cs exposes no /health endpoint, so an httpGet probe would
          # hit a 404 and be reported as unhealthy. Add health checks
          # (builder.Services.AddHealthChecks() + app.MapHealthChecks("/health"))
          # and switch these to httpGet when you want real dependency checking.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          # Covers the startup migration, which can take a while on a cold DB.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: orderapi
  namespace: orderoo
  labels:
    app.kubernetes.io/name: orderapi
    app.kubernetes.io/part-of: orderoo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orderapi
  ports:
    - name: http
      port: 8080
      targetPort: http
